<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Quadro · Fluxograma Organizacional Orflie</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<main class="main-largo">
  <div class="card">
    <h1>Quadro de Atribuições</h1>
    <div class="quadro-abas" id="quadro-abas"></div>
    <p style="font-size: 0.75rem; color: var(--text-muted); margin: -0.5rem 0 1rem;">
      Clique numa aba pra trocar de quadro. Duplo clique no nome renomeia.
    </p>
    <div class="quadro-toolbar" id="quadro-toolbar"></div>
    <p style="font-size: 0.8rem; color: var(--text-muted); margin: -0.5rem 0 1rem;">
      Arraste os quadrados para posicionar. Clique em um e depois em outro pra conectar
      (ou desconectar). Duplo clique num item do quadro, ou na legenda, pra renomear.
    </p>
    <div class="quadro-area">
      <div class="quadro-wrap" id="quadro-wrap">
        <div class="quadro-canvas" id="quadro-canvas">
          <svg class="svg-conexoes" id="svg-conexoes"></svg>
        </div>
      </div>
      <aside class="quadro-legenda">
        <h2>Legenda</h2>
        <div id="legenda-lista"></div>
      </aside>
    </div>
  </div>
</main>

<script type="module" src="app/quadro.js"></script>
</body>
</html>
